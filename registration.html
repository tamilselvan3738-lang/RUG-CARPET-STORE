    /* 3D Button Styles */
    .btn-3d {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      font-weight: 700;
      letter-spacing: 0.025em;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease, background 0.2s ease;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transform-style: preserve-3d;
      perspective: 800px;
    }

    /* 3D Gold Accent Button */
    .btn-3d-gold {
      background: linear-gradient(180deg, #F9E79F 0%, #D4AF37 40%, #B89020 100%);
      color: #121008;
      border: 1px solid #FFE494;
      box-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.6) inset,
        0 -2px 0 rgba(0, 0, 0, 0.3) inset,
        0 4px 0 #88670F,
        0 6px 14px rgba(212, 175, 55, 0.4);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .btn-3d-gold:hover {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #FCF0BC 0%, #DFC04E 40%, #C39922 100%);
      box-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.8) inset,
        0 -2px 0 rgba(0, 0, 0, 0.3) inset,
        0 5px 0 #88670F,
        0 8px 18px rgba(212, 175, 55, 0.5);
    }
    .btn-3d-gold:active {
      transform: translateY(3px) !important;
      box-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.4) inset,
        0 -1px 0 rgba(0, 0, 0, 0.4) inset,
        0 1px 0 #88670F,
        0 2px 6px rgba(212, 175, 55, 0.3);
    }

      box-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.18) inset,
        0 -2px 0 rgba(0, 0, 0, 0.6) inset,
        0 3px 0 #090a0e,
        0 5px 10px rgba(0, 0, 0, 0.4);

    /* Sheen Effect */
    .sheen {
      position: relative;
      overflow: hidden;
    }
    .sheen::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.32) 50%, rgba(255, 255, 255, 0) 100%);
      transform: rotate(30deg);
      transition: all 0.75s ease;
      opacity: 0;
      pointer-events: none;
    }
    .sheen:hover::after {
      left: 120%;
      opacity: 1;
    }

    /* RTL specific adjustments */
    [dir="rtl"] .rtl-chevron {
      transform: rotate(180deg);
    }

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    const html = document.documentElement;
    const darkModeToggle = document.getElementById('darkModeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    const rtlToggle = document.getElementById('rtlToggle');

    let isDark = true;

    // --------------------------------------------------------
    // 1. DARK / LIGHT THEME CONTROLLER
    // --------------------------------------------------------
    function updateTheme(dark) {
      isDark = dark;
      if (isDark) {
        html.classList.add('dark');
        html.classList.remove('light');
        document.body.classList.remove('bg-[#FAF8F5]', 'text-slate-900');
        document.body.classList.add('bg-[#0A0C10]', 'text-slate-100');
        sunIcon?.classList.remove('hidden');
        moonIcon?.classList.add('hidden');
        
        const brandTitle = document.getElementById('brandLogoTitle');
        if (brandTitle) brandTitle.style.color = '#F8FAFC';
        const brandSub = document.getElementById('brandLogoSubtitle');
        if (brandSub) brandSub.style.color = '#94A3B8';
      } else {
        html.classList.remove('dark');
        html.classList.add('light');
        document.body.classList.remove('bg-[#0A0C10]', 'text-slate-100');
        document.body.classList.add('bg-[#FAF8F5]', 'text-slate-900');
        sunIcon?.classList.add('hidden');
        moonIcon?.classList.remove('hidden');

        const brandTitle = document.getElementById('brandLogoTitle');
        if (brandTitle) brandTitle.style.color = '#0F172A';
        const brandSub = document.getElementById('brandLogoSubtitle');
        if (brandSub) brandSub.style.color = '#475569';
      }
      try {
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      } catch(e) {}

      // Framer Motion micro-spring for icon
      if (window.Motion && Motion.animate) {
        Motion.animate('#darkModeToggle', {
          rotate: [0, 180, 360],
          scale: [1, 0.85, 1]
        }, { duration: 0.45, easing: Motion.spring({ stiffness: 300, damping: 18 }) });
      }
    }

    darkModeToggle?.addEventListener('click', () => updateTheme(!isDark));

    // --------------------------------------------------------
    // 2. RTL / LTR CONTROLLER
    // --------------------------------------------------------
    let isRtl = false;
    function updateDirection(rtl) {
      isRtl = rtl;
      const dirVal = isRtl ? 'rtl' : 'ltr';
      html.setAttribute('dir', dirVal);
      try {
        localStorage.setItem('dir', dirVal);
      } catch(e) {}

      if (window.Motion && Motion.animate) {
        Motion.animate('#rtlToggle', {
          scale: [1, 1.18, 1],
          rotate: isRtl ? [0, 180] : [180, 0]
        }, { duration: 0.4, easing: Motion.spring({ stiffness: 380, damping: 20 }) });
      }
    }

    rtlToggle?.addEventListener('click', () => updateDirection(!isRtl));

    // --------------------------------------------------------
    // 3. SHOW / HIDE PASSWORD TOGGLES
    // --------------------------------------------------------
    const passwordInput = document.getElementById('regPassword');
    const toggleRegPasswordBtn = document.getElementById('toggleRegPasswordBtn');
    const eyeIconReg = document.getElementById('eyeIconReg');
    const eyeOffIconReg = document.getElementById('eyeOffIconReg');

    toggleRegPasswordBtn?.addEventListener('click', () => {
      const isPass = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPass ? 'text' : 'password');
      if (isPass) {
        eyeIconReg.classList.add('hidden');
        eyeOffIconReg.classList.remove('hidden');
      } else {
        eyeIconReg.classList.remove('hidden');
        eyeOffIconReg.classList.add('hidden');
      }
    });

    const confirmInput = document.getElementById('regConfirmPassword');
    const toggleRegConfirmBtn = document.getElementById('toggleRegConfirmBtn');
    const eyeConfirmIcon = document.getElementById('eyeConfirmIcon');
    const eyeConfirmOffIcon = document.getElementById('eyeConfirmOffIcon');

    toggleRegConfirmBtn?.addEventListener('click', () => {
      const isPass = confirmInput.getAttribute('type') === 'password';
      confirmInput.setAttribute('type', isPass ? 'text' : 'password');
      if (isPass) {
        eyeConfirmIcon.classList.add('hidden');
        eyeConfirmOffIcon.classList.remove('hidden');
      } else {
        eyeConfirmIcon.classList.remove('hidden');
        eyeConfirmOffIcon.classList.add('hidden');
      }
    });

    // --------------------------------------------------------
    // 4. MEMBERSHIP TIER SELECTOR
    // --------------------------------------------------------
    let selectedTier = 'Collector';
    const tierButtons = document.querySelectorAll('.tier-btn');
    tierButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tierButtons.forEach(b => {
          b.className = 'tier-btn py-1.5 rounded-lg text-slate-700 dark:text-slate-400 hover:text-black dark:hover:text-white transition-all';
        });
        btn.className = 'tier-btn py-1.5 rounded-lg bg-gold-500 text-black dark:bg-gold-500/20 dark:text-gold-400 font-bold border border-gold-500/50 shadow-sm transition-all';
        selectedTier = btn.dataset.tier;
        if (window.Motion && Motion.animate) {
          Motion.animate(btn, { scale: [0.95, 1.05, 1] }, { duration: 0.3, easing: Motion.spring({ stiffness: 400, damping: 18 }) });
        }
      });
    });

    // --------------------------------------------------------
    // 5. REGISTRATION FORM SUBMISSION
    // --------------------------------------------------------
    const portalRegisterForm = document.getElementById('portalRegisterForm');
    portalRegisterForm?.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('regFullName')?.value || 'Collector';
      const email = document.getElementById('regEmail')?.value || '';
      const pass = passwordInput?.value || '';
      const confirmPass = confirmInput?.value || '';

      if (pass !== confirmPass) {
        alert('⚠️ Passwords do not match. Please verify your master passkey.');
        const card = document.getElementById('registerCard');
        if (window.Motion && Motion.animate && card) {
          Motion.animate(card, { x: [0, -10, 10, -7, 7, -3, 3, 0] }, { duration: 0.45 });
        }
        return;
      }
      
      alert(`🎉 Welcome to the Guild of Connoisseurs!\n\nMember: ${name}\nTier: ${selectedTier}\nSecurity: 256-Bit Provenance Identity Minted.\n\nRedirecting to your Atelier Portal...`);
      window.location.href = 'login.html';
    });

    // --------------------------------------------------------
    // 6. SOCIAL REGISTRATION (Google, Facebook, Apple)
    // --------------------------------------------------------
    const handleSocialAuth = (provider) => {
      alert(`🔐 Authenticating via ${provider} Secure OAuth...\n\nProvisioning your Atelier Connoisseur account.`);
      window.location.href = 'about.html';
    };

    document.getElementById('googleRegBtn')?.addEventListener('click', () => handleSocialAuth('Google'));
    document.getElementById('facebookRegBtn')?.addEventListener('click', () => handleSocialAuth('Facebook'));
    document.getElementById('appleRegBtn')?.addEventListener('click', () => handleSocialAuth('Apple'));

    // --------------------------------------------------------
    // 7. RESTORE SAVED THEME / RTL & EXTRAORDINARY FRAMER MOTION
    // --------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') updateTheme(false);
        else updateTheme(true);

        const savedDir = localStorage.getItem('dir');
        if (savedDir === 'rtl') updateDirection(true);
        else updateDirection(false);
      } catch(e) {}

      // ======================================================
      // EXTRAORDINARY FRAMER MOTION ENGINE
      // ======================================================
      const card = document.getElementById('registerCard');
      if (window.Motion && Motion.animate && card) {
        
        // 1. Cinematic 3D Card Entrance with Spring Physics
        Motion.animate(card, {
          opacity: [0, 1],
          scale: [0.91, 1],
          y: [35, 0],
          rotateX: [8, 0]
        }, {
          duration: 0.75,
          easing: Motion.spring({ stiffness: 220, damping: 20 })
        });

        // 2. Sacred Loom Emblem 3D Spin & Radiance Reveal
        const emblem = card.querySelector('#brandLogo .relative.w-7');
        if (emblem) {
          Motion.animate(emblem, {
            rotate: [-45, 0],
            scale: [0.65, 1],
            opacity: [0, 1]
          }, {
            delay: 0.15,
            duration: 0.8,
            easing: Motion.spring({ stiffness: 260, damping: 18 })
          });
        }

        // 3. Staggered Cascading Reveal of Child Elements
        const elementsToStagger = card.querySelectorAll([
          '#brandLogoTitle',
          '#portalSubheading',
          '#regFullName',
          '#regEmail',
          '#membershipTierGroup',
          '#regPassword',
          '#regConfirmPassword',
          '#termsCheckbox',
          '#registerSubmitBtn',
          '.select-none.whitespace-nowrap',
          '#googleRegBtn',
          '#facebookRegBtn',
          '#appleRegBtn',
          '#signInLinkBtn'
        ].join(', '));

        elementsToStagger.forEach((el, idx) => {
          Motion.animate(el, {
            opacity: [0, 1],
            y: [12, 0]
          }, {
            delay: 0.2 + idx * 0.035,
            duration: 0.45,
            easing: Motion.spring({ stiffness: 300, damping: 24 })
          });
        });

        // 4. Interactive 3D Perspective Card Tilt Following Mouse Gyro
        let cardBounds = card.getBoundingClientRect();
        window.addEventListener('resize', () => { cardBounds = card.getBoundingClientRect(); });

        document.addEventListener('mousemove', (e) => {
          if (!cardBounds) return;
          const cardCenterX = cardBounds.left + cardBounds.width / 2;
          const cardCenterY = cardBounds.top + cardBounds.height / 2;
          const deltaX = (e.clientX - cardCenterX) / (window.innerWidth / 2);
          const deltaY = (e.clientY - cardCenterY) / (window.innerHeight / 2);

          const maxTiltDeg = 4.2;
          Motion.animate(card, {
            rotateY: deltaX * maxTiltDeg,
            rotateX: -deltaY * maxTiltDeg
          }, {
            duration: 0.35,
            easing: Motion.spring({ stiffness: 240, damping: 25 })
          });
        });

        // Reset tilt on mouseleave
        document.addEventListener('mouseleave', () => {
          Motion.animate(card, {
            rotateY: 0,
            rotateX: 0
          }, {
            duration: 0.5,
            easing: Motion.spring({ stiffness: 280, damping: 22 })
          });
        });

        // 5. Interactive Magnetic Scale Physics on Buttons
        const interactiveBtns = card.querySelectorAll('.btn-3d, .social-btn');
        interactiveBtns.forEach(btn => {
          btn.addEventListener('mouseenter', () => {
            Motion.animate(btn, { scale: 1.025 }, { duration: 0.2, easing: Motion.spring({ stiffness: 400, damping: 20 }) });
          });
          btn.addEventListener('mouseleave', () => {
            Motion.animate(btn, { scale: 1 }, { duration: 0.25, easing: Motion.spring({ stiffness: 350, damping: 22 }) });
          });
          btn.addEventListener('mousedown', () => {
            Motion.animate(btn, { scale: 0.96 }, { duration: 0.1 });
          });
          btn.addEventListener('mouseup', () => {
            Motion.animate(btn, { scale: 1.025 }, { duration: 0.15, easing: Motion.spring({ stiffness: 450, damping: 18 }) });
          });
        });

        // 6. Eye Icons Spring Rotation
        [toggleRegPasswordBtn, toggleRegConfirmBtn].forEach(btn => {
          btn?.addEventListener('click', () => {
            Motion.animate(btn, {
              scale: [1, 1.25, 1],
              rotate: [0, 180, 360]
            }, { duration: 0.45, easing: Motion.spring({ stiffness: 340, damping: 20 }) });
          });
        });
      }
    });
  </script>
</body>
</html>
